version: 2.1

# What every workflow shares: the build image as the executors, the module
# commands, and the gate that the image is on Docker Hub. Merged into every
# pipeline by the setup workflow (.circleci/config.yml, utils/ci/configs.py).
#
# A job has a key of its inputs (the image, its sources' git trees, the keys
# of the modules it takes: utils/ci/configs.py holds the table). A module's
# job restores its outputs from the cache under that key, builds only on a
# miss, and stores them as one tarball; the jobs taking the module restore it
# from there. A check stores a mark that it passed. The setup workflow renders
# the cached job in the place of a job with nothing to do.

parameters:
  image:
    description: The build image, unfr0zen/unfr0zen-build at the Dockerfile's tag.
    type: string
    default: ""
  build-image:
    description: utils/ci/ changed, so this pipeline publishes the image and the gate waits for it.
    type: boolean
    default: false

# Every job sharing a cache works in /tmp/project: the cache restores a file
# to the absolute path it was saved from, and the modules pass between
# executors with different home directories.
executors:
  build:
    docker:
      - image: << pipeline.parameters.image >>
        auth:
          username: $DOCKERHUB_USER
          password: $DOCKERHUB_TOKEN
    resource_class: arm.medium.gen2
    working_directory: /tmp/project
    environment:
      IMAGE: << pipeline.parameters.image >>
      # The container reports the host's cores; the class has two.
      CARGO_BUILD_JOBS: "2"
      JOBS: "2"
  # Four cores for the firmware's cmake builds and everything cargo.
  build-large:
    docker:
      - image: << pipeline.parameters.image >>
        auth:
          username: $DOCKERHUB_USER
          password: $DOCKERHUB_TOKEN
    resource_class: arm.large.gen2
    working_directory: /tmp/project
    environment:
      IMAGE: << pipeline.parameters.image >>
      CARGO_BUILD_JOBS: "4"
      JOBS: "4"
  # For the jobs needing only git, curl and python.
  tools:
    docker:
      - image: cimg/python:3.13
    resource_class: small
    working_directory: /tmp/project

commands:
  # Every job's key, into .work/keys.
  keys:
    steps:
      - run:
          name: The keys
          command: python3 utils/ci/configs.py keys

  # The module's tarball from the cache, unpacked when there.
  module-restore:
    parameters:
      module:
        type: string
    steps:
      - restore_cache:
          keys:
            - module-<< parameters.module >>-v2-{{ checksum ".work/keys/<< parameters.module >>" }}
      - run:
          name: Unpack << parameters.module >> if cached
          command: |
            if [ -f .work/cache/<< parameters.module >>.tar ]; then
              tar xf .work/cache/<< parameters.module >>.tar && echo "<< parameters.module >> is cached"
            else
              echo "<< parameters.module >> is not cached"
            fi

  # The build, unless the cache had it.
  module-build:
    parameters:
      module:
        type: string
      command:
        type: string
    steps:
      - run:
          name: Build << parameters.module >>
          no_output_timeout: 30m
          command: |
            [ ! -f .work/cache/<< parameters.module >>.tar ] || { echo "<< parameters.module >> is cached"; exit 0; }
            << parameters.command >>

  # The outputs as one tarball, into the cache.
  module-store:
    parameters:
      module:
        type: string
      outputs:
        type: string
    steps:
      - run:
          name: Pack << parameters.module >>
          command: |
            [ -f .work/cache/<< parameters.module >>.tar ] || tar cf .work/cache/<< parameters.module >>.tar << parameters.outputs >>
            tar tf .work/cache/<< parameters.module >>.tar
      - save_cache:
          key: module-<< parameters.module >>-v2-{{ checksum ".work/keys/<< parameters.module >>" }}
          paths:
            - .work/cache/<< parameters.module >>.tar

  # Every module from the cache, as build/: the jobs upstream stored the ones
  # that were missing.
  firmware:
    steps:
      - restore_cache:
          keys:
            - module-recovery-v2-{{ checksum ".work/keys/recovery" }}
      - restore_cache:
          keys:
            - module-j49-v2-{{ checksum ".work/keys/j49" }}
      - restore_cache:
          keys:
            - module-j49-kernel-v2-{{ checksum ".work/keys/j49-kernel" }}
      - restore_cache:
          keys:
            - module-zbwake-v2-{{ checksum ".work/keys/zbwake" }}
      - restore_cache:
          keys:
            - module-radio-v2-{{ checksum ".work/keys/radio" }}
      - restore_cache:
          keys:
            - module-thread-v2-{{ checksum ".work/keys/thread" }}
      - restore_cache:
          keys:
            - module-doom-v2-{{ checksum ".work/keys/doom" }}
      - restore_cache:
          keys:
            - module-nlclient-v2-{{ checksum ".work/keys/nlclient" }}
      - restore_cache:
          keys:
            - module-nestlocal-v2-{{ checksum ".work/keys/nestlocal" }}
      - run:
          name: Unpack the firmware
          command: |
            for module in recovery j49 j49-kernel zbwake radio thread doom nlclient nestlocal; do
              tar xf .work/cache/$module.tar || { echo "$module is not in the cache"; exit 1; }
            done
            find build -type f | sort

  # The mark that the check passed with these inputs: the setup workflow
  # finds it and has the next pipeline with the same ones skip the job.
  passed:
    parameters:
      check:
        type: string
    steps:
      - run:
          name: Mark << parameters.check >> as passed
          command: mkdir -p .work/passed && touch .work/passed/<< parameters.check >>
      - save_cache:
          key: passed-<< parameters.check >>-v2-{{ checksum ".work/keys/<< parameters.check >>" }}
          paths:
            - .work/passed/<< parameters.check >>

  cargo-registry-restore:
    steps:
      - restore_cache:
          keys:
            - cargo-registry-v1-{{ checksum "Cargo.lock" }}
  cargo-registry-store:
    steps:
      - save_cache:
          key: cargo-registry-v1-{{ checksum "Cargo.lock" }}
          paths:
            - /usr/local/cargo/registry

  # A job's cargo target directory, for the dependencies compiled in it, under
  # a key of the image (its toolchain) and Cargo.lock. A key is stored once,
  # so the workspace's own crates in it age and rebuild from the checkout.
  # Given a module, the key is one of an empty directory when the module's
  # tarball came from the cache: nothing compiles then.
  cargo-target-restore:
    parameters:
      cache:
        type: string
      path:
        type: string
        default: target
      module:
        type: string
        default: ""
    steps:
      - run:
          name: << parameters.cache >>'s target key
          command: |
            mkdir -p .work/keys << parameters.path >>
            if [ -f ".work/cache/<< parameters.module >>.tar" ]; then
              echo unused
            else
              echo "$IMAGE"
              sha256sum Cargo.lock
            fi > .work/keys/target-<< parameters.cache >>
      - restore_cache:
          keys:
            - cargo-target-<< parameters.cache >>-v2-{{ checksum ".work/keys/target-<< parameters.cache >>" }}
  cargo-target-store:
    parameters:
      cache:
        type: string
      path:
        type: string
        default: target
    steps:
      - save_cache:
          key: cargo-target-<< parameters.cache >>-v2-{{ checksum ".work/keys/target-<< parameters.cache >>" }}
          paths:
            - << parameters.path >>

jobs:
  # In the place of a job with nothing to do, under its name: its module is
  # in the cache, or it passed with these inputs. What requires the job and
  # GitHub's required checks see it succeed.
  cached:
    parameters:
      platform:
        description: Unused, an app entry's parameter.
        type: string
        default: ""
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run: echo "nothing to do, its inputs are those of an earlier run"

  # The gate: the build image for this Dockerfile is on Docker Hub. When this
  # push changed utils/ci/, the build-image workflow is publishing it in this
  # same pipeline, so wait for it; otherwise a missing image is an error.
  image-ready:
    executor: tools
    environment:
      IMAGE: << pipeline.parameters.image >>
      IMAGE_BUILDING: << pipeline.parameters.build-image >>
    steps:
      - run:
          name: Wait for << pipeline.parameters.image >>
          no_output_timeout: 60m
          command: |
            [ -n "$IMAGE" ] || { echo "no image parameter: the setup workflow sets it"; exit 1; }
            repo=${IMAGE%%:*}; tag=${IMAGE#*:}
            # The image is public: without the context (a fork's pull request), ask anonymously.
            set --
            [ -z "${DOCKERHUB_USER:-}" ] || set -- -u "$DOCKERHUB_USER:$DOCKERHUB_TOKEN"
            for attempt in $(seq 1 100); do
              curl -fsS -o /tmp/token.json "$@" \
                "https://auth.docker.io/token?service=registry.docker.io&scope=repository:$repo:pull" \
                || { echo "Docker Hub refused the docker-hub context's DOCKERHUB_USER and DOCKERHUB_TOKEN"; exit 1; }
              token=$(python3 -c 'import json, sys; print(json.load(sys.stdin)["token"])' < /tmp/token.json)
              status=$(curl -sS -o /dev/null -w '%{http_code}' -I -H "Authorization: Bearer $token" \
                -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
                "https://registry-1.docker.io/v2/$repo/manifests/$tag")
              case $status in
                200) echo "$IMAGE is on Docker Hub"; exit 0 ;;
                404)
                  if [ "$IMAGE_BUILDING" = true ]; then
                    echo "$IMAGE is not on Docker Hub yet; the build-image workflow is making it ($attempt)"
                    sleep 30
                  else
                    echo "$IMAGE is not on Docker Hub. It is built when a push changes utils/ci/; rerun that workflow or push a change there."
                    exit 1
                  fi ;;
                *) echo "Docker Hub answered $status for $IMAGE"; exit 1 ;;
              esac
            done
            echo "gave up waiting for $IMAGE"; exit 1

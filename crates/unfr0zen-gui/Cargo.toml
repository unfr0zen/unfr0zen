[package]
name = "unfr0zen-gui"
version = "0.1.0"
edition.workspace = true
description = "unfr0zen desktop: the recovery flow in a simple native window"

[[bin]]
name = "unfr0zen"
path = "src/main.rs"

[dependencies]
unfr0zen-host = { path = "../unfr0zen-host" }
unfr0zen-core = { path = "../unfr0zen-core" }
crc32fast = "1"
eframe = "0.35"
egui = "0.35"
log = "0.4"
rfd = "0.17"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
single-instance = "0.3"
serde_json = "1"

[target.'cfg(unix)'.dependencies]
unfr0zen-cli = { path = "../unfr0zen-cli" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage", "NSMenu", "NSMenuItem", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSAttributedString", "NSDate", "NSDateFormatter", "NSDictionary", "NSFormatter", "NSObject", "NSString"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
libc = "0.2"

[build-dependencies]
winresource = "0.1"
serde_json = "1"

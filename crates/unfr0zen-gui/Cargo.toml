[package]
name = "unfr0zen-gui"
version = "0.1.0"
edition.workspace = true
description = "unfr0zen desktop: the recovery flow in a simple native window"

[[bin]]
name = "unfr0zen"
path = "src/main.rs"

[dependencies]
unfr0zen-host = { path = "../unfr0zen-host" }
eframe = "0.35"
egui = "0.35"
rfd = "0.17"
single-instance = "0.3"

[target.'cfg(unix)'.dependencies]
unfr0zen-cli = { path = "../unfr0zen-cli" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage", "NSMenu", "NSMenuItem", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSAttributedString", "NSDictionary", "NSObject", "NSString"] }

[build-dependencies]
winresource = "0.1"

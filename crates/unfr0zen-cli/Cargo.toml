[package]
name = "unfr0zen-cli"
version = "0.1.0"
edition.workspace = true
description = "unfr0zen: recover a Nest (diamond3) over USB, patch its root volume from the unit, confirm a root shell (terminal)"

[dependencies]
unfr0zen-host = { path = "../unfr0zen-host" }
clap = { version = "4", features = ["derive"] }
log = "0.4"
serde_json = "1.0.151"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
enable-ansi-support = "0.3"

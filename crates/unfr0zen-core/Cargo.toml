[package]
name = "unfr0zen-core"
version = "0.1.0"
edition.workspace = true
description = "Device protocols and recovery logic for unfr0zen"

[[bin]]
name = "nlclient"
path = "tools/nlclient.rs"

[[bin]]
name = "boot_branding"
path = "tools/boot_branding.rs"

[dependencies]
base64 = "0.22"
crc32fast = "1"
flate2 = "1"
getrandom = { version = "0.3", features = ["std"] }
log = "0.4"
regex = "1"
sha2 = "0.10"
rsa = { version = "0.9", features = ["sha2"] }
sha-crypt = { version = "0.5", default-features = false }
tar = { version = "0.4", default-features = false }
x509-cert = { version = "0.2", features = ["builder", "pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }
capstone = { version = "0.14.0", default-features = false, features = ["std", "full", "arch_arm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
adler2 = "2"
lzokay = "2.0.1"

version: 2.1

# nestlocal and thread-rcp for the thermostat, carrying the radio images and
# every zbwake.ko: the radio, zbwake and j49 modules are its inputs, so its
# workflow builds them (from the cache when unchanged) before it. Runs when
# crates/nestlocal changes.

parameters:
  nestlocal:
    type: boolean
    default: false

jobs:
  nestlocal:
    executor: build-large
    steps:
      - checkout
      - modules
      - run:
          name: The j49's zbwake.ko beside the gen 3's
          command: cp build/j49/zbwake.ko build/zbwake/j49.ko
      - module-restore:
          module: nestlocal
          paths: crates/nestlocal Cargo.toml Cargo.lock
          files: build/radio/radio.bin build/radio-em357-zigbee/radio.bin build/zbwake/*.ko
      - cargo-registry-restore
      - module-build:
          module: nestlocal
          command: sh platform/common/radio/thread/nestlocal.sh
      - cargo-registry-store
      - module-store:
          module: nestlocal
          outputs: build/thread/nestlocal build/thread/thread-rcp build/nestlocal-armv7

workflows:
  nestlocal:
    when: << pipeline.parameters.nestlocal >>
    jobs:
      - image-ready:
          context: docker-hub
      - radio:
          requires: [image-ready]
          context: docker-hub
      - zbwake-release:
          matrix:
            parameters:
              release: __ZBWAKE_RELEASES__
          name: zbwake-<< matrix.release >>
          requires: [image-ready]
          context: docker-hub
      - zbwake:
          requires: [zbwake-release]
      - j49-kernel
      - nestlocal:
          requires: [radio, zbwake, j49-kernel]
          context: docker-hub

version: 2.1

# zbwake.ko for each gen 3 release, against Nest's published kernel sources,
# in one job: each release's module has a cache of its own, and the releases
# missing from it build together. The setup workflow (utils/ci/configs.py)
# repeats the module-restore and module-store steps for each release of the
# releases file.

jobs:
  zbwake:
    executor: build
    steps:
      - checkout
      # Keyed on the sources alone, not the releases file or this config: a
      # release added builds its own module and keeps the others'.
      - module-restore: { module: "zbwake-__ZBWAKE_RELEASE__", paths: platform/diamond3/zbwake/build.sh platform/diamond3/zbwake/zbwake.c platform/diamond3/zbwake/Kbuild }
      - run:
          name: Build zbwake for the releases not cached
          no_output_timeout: 30m
          command: |
            set --
            for release in $(cat platform/diamond3/zbwake/releases); do
              [ -f ".work/cache/zbwake-$release.tar" ] || set -- "$@" "$release"
            done
            [ $# -gt 0 ] || { echo "every release is cached"; exit 0; }
            ZBWAKE_JOBS=$JOBS sh platform/diamond3/zbwake/build.sh build/zbwake "$@"
      - module-store: { module: "zbwake-__ZBWAKE_RELEASE__", outputs: "build/zbwake/__ZBWAKE_RELEASE__.ko", persist: false }
      - persist_to_workspace:
          root: .
          paths:
            - .work/cache/zbwake-*.tar

version: 2.1

# The gen 3's boot chain: the ROM bootstrap and boot wrapper, and the recovery
# U-Boot from the pinned submodule and its patches.

jobs:
  recovery:
    executor: build
    steps:
      - checkout
      - module-restore:
          module: recovery
          paths: platform/diamond3/bootstrap platform/diamond3/uboot
      - module-build:
          module: recovery
          command: git submodule update --init --depth 1 platform/diamond3/uboot/upstream && python3 platform/diamond3/bootstrap/build_bootstrap.py && sh platform/diamond3/uboot/build_uboot.sh
      - module-store:
          module: recovery
          outputs: build/u-boot-sdp-official.hab build/rom-stage.imx build/boot-wrapper.bin build/u-boot-recovery.bin build/u-boot-recovery.json

version: 2.1

# The radio: its firmware for the gen 3's EM3581 and the gen 2's EM357 Zigbee
# and Thread personalities, and OpenThread's host side for the thermostat.
# Its workflow runs when platform/common/radio changes.

parameters:
  radio:
    type: boolean
    default: false

jobs:
  radio:
    executor: build-large
    steps:
      - checkout
      - module-restore:
          module: radio
          paths: platform/common/radio
      - module-build:
          module: radio
          command: sh platform/common/radio/fetch-sdk.sh .work/zigbee-sdk > /dev/null && sh platform/common/radio/thread/fetch-openthread.sh && sh platform/common/radio/thread/radio.sh
      - module-store:
          module: radio
          outputs: build/radio build/radio-em357-zigbee build/radio-em357-thread

  thread:
    executor: build-large
    steps:
      - checkout
      - module-restore:
          module: thread
          paths: platform/common/radio/thread
      - module-build:
          module: thread
          command: sh platform/common/radio/thread/fetch-openthread.sh && sh platform/common/radio/thread/host.sh
      - module-store:
          module: thread
          outputs: build/thread/ot-daemon build/thread/ot-ctl

workflows:
  radio:
    when: << pipeline.parameters.radio >>
    jobs:
      - image-ready:
          context: docker-hub
      - radio:
          requires: [image-ready]
          context: docker-hub
      - thread:
          requires: [image-ready]
          context: docker-hub

version: 2.1

# The UNFR0ZEN screen's object for the unit's nlclient, and the screen's host
# test.

jobs:
  nlclient:
    executor: build
    steps:
      - checkout
      - module-restore:
          module: nlclient
          paths: platform/common/nlclient/src
      - module-build:
          module: nlclient
          command: sh platform/common/nlclient/build.sh build
      - module-store:
          module: nlclient
          outputs: build/custom-screen.o build/j49-rcs-screen.o
      - run:
          name: nlclient navigation
          command: |
            clang -std=c11 -Wall -Wextra -Werror platform/common/nlclient/tests/custom_flow_test.c -o /tmp/custom-flow-test
            /tmp/custom-flow-test
            clang -std=c11 -Wall -Wextra -Werror platform/common/nlclient/tests/rcs_screen_test.c -o /tmp/rcs-screen-test
            /tmp/rcs-screen-test

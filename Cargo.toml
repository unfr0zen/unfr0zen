[workspace]
resolver = "2"
members = ["crates/unfr0zen-core", "crates/unfr0zen-host", "crates/unfr0zen-cli", "crates/unfr0zen-gui", "crates/nestlocal", "client-ng"]

[workspace.package]
edition = "2021"

[profile.release]
lto = true
strip = true
codegen-units = 1

# nestlocal and the Thread bridge minimize size to fit the thermostat's
# limited root volume.
[profile.thermostat]
inherits = "release"
opt-level = "z"

[profile.client]
inherits = "release"
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3

blueprint:
  name: Nest weather over Zigbee (unfr0zen)
  description: >-
    Sends the outdoor temperature and humidity, conditions and forecast to a
    Nest thermostat running unfr0zen on Zigbee2MQTT, every 15 minutes.
    Temperatures in °F are converted to °C. The thermostat sets its clock from
    Zigbee2MQTT by itself.
  domain: automation
  source_url: https://github.com/unfr0zen/unfr0zen/blob/main/integrations/home-assistant/weather-zigbee.yaml
  input:
    thermostat:
      name: Thermostat
      description: The Nest thermostat, as Zigbee2MQTT shows it to Home Assistant.
      selector:
        device:
          filter:
            # Zigbee2MQTT's model, in the device's model_id (its model holds the description).
            - integration: mqtt
              manufacturer: Google Nest
              model_id: Nest Learning Thermostat (3rd gen, unfr0zen)
            - integration: mqtt
              manufacturer: Google Nest
              model_id: Nest Learning Thermostat (2nd gen, unfr0zen)
    base_topic:
      name: Zigbee2MQTT base topic
      description: As in Zigbee2MQTT's configuration (mqtt.base_topic).
      default: zigbee2mqtt
      selector:
        text:
    temperature:
      name: Outdoor temperature
      description: Optional; defaults to the weather entity's temperature.
      default:
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature
    humidity:
      name: Outdoor humidity
      description: Optional; defaults to the weather entity's humidity.
      default:
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: humidity
    weather:
      name: Weather
      description: For the conditions and the forecast, such as Met.no's.
      selector:
        entity:
          filter:
            - domain: weather

mode: single
triggers:
  - trigger: time_pattern
    minutes: /15
  - trigger: homeassistant
    event: start
  - trigger: state
    entity_id: !input weather
    from:
      - unavailable
      - unknown
conditions:
  - condition: template
    value_template: "{{ states(weather) != 'unavailable' }}"
variables:
  thermostat: !input thermostat
  base_topic: !input base_topic
  temperature: !input temperature
  humidity: !input humidity
  weather: !input weather
actions:
  - variables:
      # Zigbee2MQTT identifies the device to Home Assistant by its IEEE
      # address, which its topics take in place of the friendly name.
      address: >-
        {{ device_attr(thermostat, 'identifiers') | map(attribute=1)
           | select('match', 'zigbee2mqtt_') | map('replace', 'zigbee2mqtt_', '') | first }}
      # daily when the entity has it, else twice_daily (NWS)
      daily_type: >-
        {{ 'daily' if (state_attr(weather, 'supported_features') | int(0)) % 2
           else 'twice_daily' }}
  - action: weather.get_forecasts
    target:
      entity_id: "{{ weather }}"
    data:
      type: hourly
    response_variable: hourly
  - action: weather.get_forecasts
    target:
      entity_id: "{{ weather }}"
    data:
      type: "{{ daily_type }}"
    response_variable: daily
  # A reading that is not a number (unavailable, ...) leaves the last one
  # on the thermostat. The thermostat takes °C; Home Assistant gives a
  # sensor's reading in the sensor's unit and the weather entity's in
  # temperature_unit.
  - action: mqtt.publish
    data:
      topic: "{{ base_topic }}/{{ address }}/set"
      payload: >-
        {%- set raw = states(temperature) if temperature else state_attr(weather, 'temperature') -%}
        {%- set unit = state_attr(temperature, 'unit_of_measurement') if temperature else state_attr(weather, 'temperature_unit') -%}
        {%- set outdoor = raw | float(none) -%}
        {%- if outdoor is number and unit == '°F' -%}
          {%- set outdoor = ((outdoor - 32) * 5 / 9) | round(2) -%}
        {%- endif -%}
        {%- set outdoor_humidity = (states(humidity) if humidity else state_attr(weather, 'humidity')) | float(none) -%}
        {%- set hours = hourly[weather].forecast[:24] -%}
        {%- set fahrenheit = state_attr(weather, 'temperature_unit') == '°F' -%}
        {%- set celsius = namespace(forecast=[]) -%}
        {%- for f in hours + daily[weather].forecast[:14] -%}
          {%- if fahrenheit and f.temperature is number -%}
            {%- set f = dict(f, temperature=((f.temperature - 32) * 5 / 9) | round(2)) -%}
          {%- endif -%}
          {%- if fahrenheit and f.templow is number -%}
            {%- set f = dict(f, templow=((f.templow - 32) * 5 / 9) | round(2)) -%}
          {%- endif -%}
          {%- set celsius.forecast = celsius.forecast + [f] -%}
        {%- endfor -%}
        {{ {"outdoor_temperature": outdoor,
            "outdoor_humidity": outdoor_humidity,
            "weather": {"condition": states(weather),
                        "next_rising": state_attr('sun.sun', 'next_rising'),
                        "next_setting": state_attr('sun.sun', 'next_setting'),
                        "hourly": celsius.forecast[:hours | length],
                        "daily": celsius.forecast[hours | length:]}} | to_json }}
